name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build main.bicep
        run: az bicep build --file main.bicep

      - name: Build modules
        run: |
          az bicep build --file modules/cae.bicep
          az bicep build --file modules/sql.bicep

      - name: Build main.bicepparam
        run: az bicep build-params --file main.bicepparam
